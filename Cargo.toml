[package]
name = "embedded-usb-pd"
version = "0.1.0"
edition = "2021"

[dependencies]
defmt = { version = "0.3", optional = true }
embedded-hal-async = "1.0.0"
bitfield = "0.19.0"
bytemuck = { version = "1.25.0", optional = true, features = [
    "derive",
    "must_cast",
] }
pack1 = { version = "1.1.0", optional = true, features = ["bytemuck"] }

[features]
default = []
defmt = ["dep:defmt"]
# Enable UCSI v1.2 data structures
ucsi-v1_2 = ["dep:bytemuck", "dep:pack1"]

[lints.clippy]
correctness = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
perf = "deny"
suspicious = "deny"
style = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
